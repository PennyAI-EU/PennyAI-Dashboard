<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Penny AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --white: #ffffff;
    --off: #f7f6f3;
    --border: #e8e6e0;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-light: #eff4ff;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --radius: 10px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--white);
    min-height: 100vh;
    display: flex;
  }

  /* ── LEFT PANEL ── */
  .auth-left {
    flex: 0 0 42%;
    background: linear-gradient(145deg, #1e3a8a 0%, #2563eb 60%, #1d4ed8 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 52px;
    position: relative;
    overflow: hidden;
  }
  .auth-left::before {
    content: '';
    position: absolute;
    width: 480px; height: 480px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
    top: -120px; right: -160px;
  }
  .auth-left::after {
    content: '';
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.07);
    bottom: 60px; left: -100px;
  }
  .auth-logo {
    font-size: 18px; font-weight: 600;
    color: white; text-decoration: none;
    letter-spacing: -0.3px; position: relative; z-index: 1;
  }
  .auth-logo span { color: rgba(255,255,255,0.55); }

  .auth-left-body { position: relative; z-index: 1; }
  .auth-left-body h2 {
    font-family: 'Instrument Serif', serif;
    font-style: italic; font-weight: 400;
    font-size: clamp(2rem, 3.2vw, 2.8rem);
    color: white; line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
  }
  .auth-left-body p {
    font-size: 15px; color: rgba(255,255,255,0.6);
    line-height: 1.7; max-width: 320px;
  }
  .auth-left-footer {
    font-size: 12px; color: rgba(255,255,255,0.3);
    position: relative; z-index: 1;
  }

  /* ── RIGHT PANEL ── */
  .auth-right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 40px;
    background: var(--white);
    overflow-y: auto;
  }
  .auth-form-wrap {
    width: 100%; max-width: 400px;
  }
  .auth-form-header {
    margin-bottom: 36px;
  }
  .auth-form-header h1 {
    font-size: 26px; font-weight: 600;
    letter-spacing: -0.5px; color: var(--text);
    margin-bottom: 6px;
  }
  .auth-form-header p {
    font-size: 14px; color: var(--muted);
    line-height: 1.6;
  }

  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text); margin-bottom: 7px;
  }
  .form-input {
    width: 100%; font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text);
    background: var(--white); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-input::placeholder { color: #b0aea8; }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }

  .form-error {
    font-size: 12px; color: #dc2626; margin-bottom: 14px;
    display: none;
  }
  .form-error.visible { display: block; }

  .btn-submit {
    width: 100%; font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    background: var(--accent); color: white;
    border: none; border-radius: 9px;
    padding: 13px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-submit:hover:not(:disabled) { background: var(--accent-dark); transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .auth-switch {
    margin-top: 28px; text-align: center;
    font-size: 13px; color: var(--muted);
  }
  .auth-switch a {
    color: var(--accent); font-weight: 500; text-decoration: none;
  }
  .auth-switch a:hover { text-decoration: underline; }

  /* ── SUCCESS STATE ── */
  .success-panel {
    display: none; text-align: center; padding: 8px 0;
  }
  .success-panel.visible { display: block; }
  .success-icon {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--green-light);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  .success-icon svg { color: var(--green); }
  .success-panel h2 {
    font-size: 22px; font-weight: 600;
    letter-spacing: -0.4px; margin-bottom: 10px;
  }
  .success-panel p {
    font-size: 14px; color: var(--muted);
    line-height: 1.7; margin-bottom: 8px;
  }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .auth-left {
      flex: none; padding: 36px 28px 40px;
      min-height: 240px;
    }
    .auth-left-body h2 { font-size: 1.8rem; }
    .auth-left-footer { display: none; }
    .auth-right { padding: 40px 24px; }
  }
</style>
</head>
<body>

<!-- LEFT PANEL -->
<div class="auth-left">
  <a class="auth-logo" href="/">Penny<span>AI</span></a>

  <div class="auth-left-body">
    <h2>Secure your<br>account.</h2>
    <p>Choose a new password to keep your progress safe.</p>
  </div>

  <div class="auth-left-footer">© 2025 Penny AI</div>
</div>

<!-- RIGHT PANEL -->
<div class="auth-right">
  <div class="auth-form-wrap">

    <!-- SET PASSWORD FORM -->
    <div id="form-section">
      <div class="auth-form-header">
        <h1>Set new password</h1>
        <p>Please enter your new password below.</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input class="form-input" id="password" type="password" placeholder="At least 8 characters" required minlength="8"/>
        </div>

        <div id="form-error" class="form-error"></div>

        <button class="btn-submit" type="submit" id="submit-btn">Update password →</button>
      </form>
    </div>

    <!-- SUCCESS STATE -->
    <div id="success-section" class="success-panel">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.46 2 2 0 0 1 3.58 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6 6l1.72-1.72a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <h2>Password updated</h2>
      <p>Your password has been successfully reset. You can now log in with your new password.</p>
      <div class="auth-switch" style="margin-top: 24px;">
        <a href="/signin.html">Go to sign in →</a>
      </div>
    </div>

  </div>
</div>

<script>
(async () => {
  let supabase = null;

  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (cfg.supabaseUrl && cfg.supabaseAnonKey) {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }
  } catch (e) {
    console.warn('Supabase config unavailable:', e);
  }

  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorEl = document.getElementById('form-error');
  const formSection = document.getElementById('form-section');
  const successSection = document.getElementById('success-section');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('visible');
  }
  function clearError() {
    errorEl.textContent = '';
    errorEl.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    if (!supabase) return showError('Authentication is unavailable right now. Please try again later.');

    const password = document.getElementById('password').value;

    if (password.length < 8) {
      return showError('Password must be at least 8 characters.');
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    try {
      // Upon clicking the magic link, Supabase sets the session via the URL hash.
      // Now we just need to update the user.
      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        throw new Error(error.message || 'Failed to update password.');
      }

      formSection.style.display = 'none';
      successSection.classList.add('visible');
    } catch (err) {
      showError(err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password →';
    }
  });

  // Check if there is an error in the URL (e.g. invalid or expired link)
  window.addEventListener('load', () => {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    if (hashParams.has('error_description')) {
      showError(hashParams.get('error_description'));
    }
  });
})();
</script>

</body>
</html>
